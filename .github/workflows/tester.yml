# Testene ved hver push og pull request: typesjekk, formatering, npm test,
# bygget og cargo test. På Mac, som appen brukes på. Et rødt kryss på GitHub
# betyr at noe har brukket.
#
# Ingen hemmeligheter og bare lesetilgang. Actions er låst til en commit,
# som i windows.yml (issue #10).
name: Tester

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En ny push avbryter en kjøring som ikke er ferdig.
concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Installer avhengigheter
        run: npm ci

      - name: Typesjekk
        run: npx tsc --noEmit -p .

      - name: Formatering
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "!src/prove-*.tsx"

      - name: npm test
        run: npm test

      - name: Bygg (Vite)
        run: npm run build

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

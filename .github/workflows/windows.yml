# Windows-versjonen av Økta (ARBEIDSLISTE §14).
#
# Fredrik har ingen Windows-maskin, så alt bygges og røyktestes her:
# npm test og cargo test kjører på Windows før installeren bygges.
#
# - Når en release publiseres: NSIS-installeren (.exe) lastes opp til den
#   samme releasen.
# - Manuelt (Actions › Windows › Run workflow): bygger og legger
#   installeren ved kjøringen som et artefakt, uten å røre noen release.
#
# Sikkerhet (issue #10): alle actions er låst til en commit, med versjonen
# som kommentar; Dependabot foreslår oppdateringer (.github/dependabot.yml).
# Bare byggejobben, som laster opp til releasen, har skrivetilgang.
#
# Mac bygges fortsatt lokalt med `npm run dmg`. Se docs/release.md.
name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Installer avhengigheter
        run: npm ci

      - name: npm test
        run: npm test

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bygg:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg installeren
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          # Tom ved manuell kjøring: da bygges det uten opplasting.
          releaseId: ${{ github.event.release.id }}

      - name: Legg installeren ved kjøringen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okta-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

# Windows-versjonen av Økta (ARBEIDSLISTE §14).
#
# Fredrik har ingen Windows-maskin, så alt bygges og røyktestes her:
# npm test og cargo test kjører på Windows før installeren bygges.
#
# - Når en release publiseres: NSIS-installeren (.exe) lastes opp til den
#   samme releasen.
# - Manuelt (Actions › Windows › Run workflow): bygger og legger
#   installeren ved kjøringen som et artefakt, uten å røre noen release.
#
# Sikkerhet (issue #10): alle actions er låst til en commit, med versjonen
# som kommentar; Dependabot foreslår oppdateringer (.github/dependabot.yml).
# Bare byggejobben, som laster opp til releasen, har skrivetilgang.
#
# Mac bygges fortsatt lokalt med `npm run dmg`. Se docs/release.md.
name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Installer avhengigheter
        run: npm ci

      - name: npm test
        run: npm test

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bygg:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg installeren
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          # Tom ved manuell kjøring: da bygges det uten opplasting.
          releaseId: ${{ github.event.release.id }}

      - name: Legg installeren ved kjøringen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okta-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Økta">
  <title>Økta</title>
  <!--
    Tre stående felt som avtar i bredde og styrke, på en avrundet plate.
    Feltene er de samme som fargestreken i venstremarg og rutene i heatmapet —
    merket er appen i miniatyr.
    Variant: mørk — hovedvariant, appikonet
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#241F33"/>
  <rect x="308" y="342" width="180" height="340" rx="24" fill="#EEEDFE"/>
  <rect x="512" y="342" width="90"  height="340" rx="24" fill="#C9C2DD"/>
  <rect x="626" y="342" width="90"  height="340" rx="24" fill="#9A90B8"/>
</svg>

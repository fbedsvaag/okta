[package]
name = "okta"
version = "0.4.0"
description = "Økta — undervisningsplanlegging og elevoppfølging"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "okta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
# CalDAV-publisering (SPEC §8.1). ureq er blokkerende og liten, og bruker
# rustls — ingen OpenSSL å holde oppdatert.
ureq = "2"
base64 = "0.22"
# Passordet hører hjemme i systemets nøkkelring, ikke i databasen:
# nøkkelringen på Mac, Windows legitimasjonsbehandling på Windows.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Operativsystem og versjon til tilbakemeldingslinja (13.1). Leser lokalt.
os_info = { version = "3", default-features = false }
# Samme sqlx som tauri-plugin-sql. Brukes til transaksjoner over flere
# setninger på én tilkobling (issue #2), med pluginens egen pulje.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "json"] }

# Windows og Linux: dobbeltklikk på en .okta-fil starter en ny prosess.
# Den sender stien til vinduet som kjører og avslutter (14.4). På Mac
# sørger systemet selv for at det bare kjører én app.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Bare i testene: sjekker at SQL-pluginens mappe og appens datamappe er den
# samme på Mac og Windows (sikkerhetskopi.rs).
dirs = "6"
# Kjører de asynkrone transaksjonstestene (transaksjon.rs).
tokio = { version = "1", features = ["rt", "macros"] }

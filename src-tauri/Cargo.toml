[package]
name = "okta"
version = "0.1.0"
description = "Økta — undervisningsplanlegging og elevoppfølging"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "okta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
# Liten, synkron HTTP-lytter til kalenderstrømmen. Bindes bare til loopback.
tiny_http = "0.12"
# CalDAV-publisering (SPEC §8.1). ureq er blokkerende og liten, og bruker
# rustls — ingen OpenSSL å holde oppdatert.
ureq = "2"
base64 = "0.22"
# Passordet hører hjemme i systemets nøkkelring, ikke i databasen.
keyring = { version = "3", features = ["apple-native"] }

